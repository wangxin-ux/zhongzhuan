<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鹈鹕骑自行车 - SVG 2D动画</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: linear-gradient(#aee7ff 0%, #d8f3ff 55%, #f7e8b5 55.5%, #f0d98c 100%);
    font-family: "Microsoft YaHei", sans-serif;
    overflow: hidden;
  }
  h1 { color: #33606d; margin-bottom: 8px; font-size: 22px; text-shadow: 0 1px 0 #fff; }
  .stage { width: 900px; max-width: 96vw; }

  /* ---------- 云朵飘动 ---------- */
  .cloud { animation: cloudMove linear infinite; }
  @keyframes cloudMove { from { transform: translateX(950px); } to { transform: translateX(-350px); } }

  /* ---------- 车轮旋转 ---------- */
  .wheel-spin { transform-box: fill-box; transform-origin: center; animation: spin 0.6s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---------- 曲柄/踏板旋转 ---------- */
  .crank-spin { transform-box: fill-box; transform-origin: center; animation: spin 1.2s linear infinite; }
  .pedal-anti { animation: pedalKeep 1.2s linear infinite; }
  @keyframes pedalKeep { to { transform: rotate(-360deg); } }

  /* ---------- 鹈鹕身体上下起伏 ---------- */
  .pelican-bob { animation: bob 0.6s ease-in-out infinite alternate; }
  @keyframes bob { from { transform: translateY(0); } to { transform: translateY(-6px); } }

  /* ---------- 腿部蹬踏（大腿摆动） ---------- */
  .thigh-l { transform-box: fill-box; transform-origin: 80% 20%; animation: thighSwing 1.2s linear infinite; }
  .thigh-r { transform-box: fill-box; transform-origin: 80% 20%; animation: thighSwing 1.2s linear infinite; animation-delay: -0.6s; }
  @keyframes thighSwing {
    0%   { transform: rotate(16deg); }
    25%  { transform: rotate(-6deg); }
    50%  { transform: rotate(-18deg); }
    75%  { transform: rotate(-2deg); }
    100% { transform: rotate(16deg); }
  }

  /* ---------- 翅膀扇动 ---------- */
  .wing { transform-box: fill-box; transform-origin: 90% 50%; animation: flap 1.4s ease-in-out infinite; }
  @keyframes flap { 0%,100% { transform: rotate(0deg); } 50% { transform: rotate(-22deg); } }

  /* ---------- 路面滚动条纹 ---------- */
  .road-dash { animation: roadScroll 0.5s linear infinite; }
  @keyframes roadScroll { from { transform: translateX(0); } to { transform: translateX(-120px); } }

  /* ---------- 地面小草快速后移 ---------- */
  .grass { animation: grassRun 1.1s linear infinite; }
  @keyframes grassRun { from { transform: translateX(960px); } to { transform: translateX(-80px); } }

  /* ---------- 尾羽摆动 ---------- */
  .tail { transform-box: fill-box; transform-origin: 10% 50%; animation: tailWag 0.6s ease-in-out infinite alternate; }
  @keyframes tailWag { from { transform: rotate(-6deg); } to { transform: rotate(8deg); } }

  /* ---------- 喉囊轻微晃动 ---------- */
  .pouch { transform-box: fill-box; transform-origin: 80% 10%; animation: pouchSwing 0.6s ease-in-out infinite alternate; }
  @keyframes pouchSwing { from { transform: rotate(0deg); } to { transform: rotate(3deg); } }
</style>
</head>
<body>

<h1>🚲 鹈鹕骑自行车 🚲</h1>

<svg class="stage" viewBox="0 0 900 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="一只鹈鹕正在骑自行车">
  <defs>
    <!-- 天空渐变 -->
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8fd8ff"/>
      <stop offset="100%" stop-color="#dff4ff"/>
    </linearGradient>
    <!-- 太阳光晕 -->
    <radialGradient id="sunGlow">
      <stop offset="0%" stop-color="#fff7c0"/>
      <stop offset="60%" stop-color="#ffe66d"/>
      <stop offset="100%" stop-color="#ffd23f" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- ================= 背景 ================= -->
  <rect x="0" y="0" width="900" height="520" fill="url(#sky)"/>
  <circle cx="790" cy="90" r="80" fill="url(#sunGlow)"/>
  <circle cx="790" cy="90" r="38" fill="#ffdf5e"/>

  <!-- 远山 -->
  <path d="M0,330 L120,240 L240,330 L360,255 L500,330 L620,250 L760,330 L860,270 L900,330 L900,340 L0,340 Z" fill="#b5e3c9" opacity="0.8"/>

  <!-- 云朵（三朵，速度不同） -->
  <g class="cloud" style="animation-duration:26s">
    <g fill="#ffffff" opacity="0.95">
      <ellipse cx="80" cy="90" rx="46" ry="24"/>
      <ellipse cx="120" cy="78" rx="34" ry="22"/>
      <ellipse cx="160" cy="95" rx="40" ry="20"/>
    </g>
  </g>
  <g class="cloud" style="animation-duration:38s; animation-delay:-15s">
    <g fill="#ffffff" opacity="0.85">
      <ellipse cx="60" cy="160" rx="36" ry="18"/>
      <ellipse cx="95" cy="150" rx="28" ry="16"/>
      <ellipse cx="128" cy="163" rx="30" ry="14"/>
    </g>
  </g>
  <g class="cloud" style="animation-duration:32s; animation-delay:-24s">
    <g fill="#ffffff" opacity="0.9">
      <ellipse cx="70" cy="230" rx="42" ry="20"/>
      <ellipse cx="110" cy="220" rx="30" ry="17"/>
    </g>
  </g>

  <!-- ================= 路面 ================= -->
  <rect x="0" y="392" width="900" height="128" fill="#e8c86e"/>
  <rect x="0" y="392" width="900" height="8" fill="#c9a54e"/>
  <!-- 路面虚线 -->
  <g class="road-dash">
    <rect x="0" y="440" width="60" height="7" rx="3.5" fill="#fff" opacity="0.85"/>
    <rect x="120" y="440" width="60" height="7" rx="3.5" fill="#fff" opacity="0.85"/>
    <rect x="240" y="440" width="60" height="7" rx="3.5" fill="#fff" opacity="0.85"/>
    <rect x="360" y="440" width="60" height="7" rx="3.5" fill="#fff" opacity="0.85"/>
    <rect x="480" y="440" width="60" height="7" rx="3.5" fill="#fff" opacity="0.85"/>
    <rect x="600" y="440" width="60" height="7" rx="3.5" fill="#fff" opacity="0.85"/>
    <rect x="720" y="440" width="60" height="7" rx="3.5" fill="#fff" opacity="0.85"/>
    <rect x="840" y="440" width="60" height="7" rx="3.5" fill="#fff" opacity="0.85"/>
    <rect x="960" y="440" width="60" height="7" rx="3.5" fill="#fff" opacity="0.85"/>
  </g>

  <!-- 路边小草 -->
  <g class="grass" style="animation-duration:1.1s">
    <g fill="#5aa856">
      <path d="M40,392 q3,-16 8,-20 q-1,12 4,20 Z"/>
      <path d="M240,392 q2,-14 10,-18 q-3,10 0,18 Z"/>
      <path d="M520,392 q4,-18 9,-22 q-2,13 3,22 Z"/>
      <path d="M760,392 q2,-12 8,-16 q-1,9 3,16 Z"/>
    </g>
  </g>
  <g class="grass" style="animation-duration:1.5s; animation-delay:-0.7s">
    <g fill="#6dbb62">
      <path d="M130,392 q3,-15 8,-19 q-1,11 4,19 Z"/>
      <path d="M430,392 q3,-13 9,-17 q-2,10 1,17 Z"/>
      <path d="M660,392 q4,-16 9,-20 q-2,12 3,20 Z"/>
    </g>
  </g>

  <!-- ================= 鹈鹕 + 自行车整体（微微前倾） ================= -->
  <g transform="translate(0,0)">

    <!-- ========== 自行车 ========== -->
    <g id="bicycle">
      <!-- 后轮 -->
      <g transform="translate(300,420)">
        <circle r="62" fill="none" stroke="#333" stroke-width="9"/>
        <circle r="56" fill="none" stroke="#777" stroke-width="2"/>
        <g class="wheel-spin">
          <g stroke="#555" stroke-width="3">
            <line x1="0" y1="-56" x2="0" y2="56"/>
            <line x1="-56" y1="0" x2="56" y2="0"/>
            <line x1="-40" y1="-40" x2="40" y2="40"/>
            <line x1="-40" y1="40" x2="40" y2="-40"/>
            <line x1="-21" y1="-52" x2="21" y2="52"/>
            <line x1="21" y1="-52" x2="-21" y2="52"/>
            <line x1="-52" y1="-21" x2="52" y2="21"/>
            <line x1="-52" y1="21" x2="52" y2="-21"/>
          </g>
          <circle r="8" fill="#444"/>
        </g>
      </g>

      <!-- 前轮 -->
      <g transform="translate(620,420)">
        <circle r="62" fill="none" stroke="#333" stroke-width="9"/>
        <circle r="56" fill="none" stroke="#777" stroke-width="2"/>
        <g class="wheel-spin">
          <g stroke="#555" stroke-width="3">
            <line x1="0" y1="-56" x2="0" y2="56"/>
            <line x1="-56" y1="0" x2="56" y2="0"/>
            <line x1="-40" y1="-40" x2="40" y2="40"/>
            <line x1="-40" y1="40" x2="40" y2="-40"/>
            <line x1="-21" y1="-52" x2="21" y2="52"/>
            <line x1="21" y1="-52" x2="-21" y2="52"/>
            <line x1="-52" y1="-21" x2="52" y2="21"/>
            <line x1="-52" y1="21" x2="52" y2="-21"/>
          </g>
          <circle r="8" fill="#444"/>
        </g>
      </g>

      <!-- 车架 -->
      <g stroke="#d94f2b" stroke-width="11" stroke-linecap="round" fill="none">
        <!-- 后叉到五通 -->
        <line x1="300" y1="420" x2="430" y2="420"/>
        <!-- 座管 -->
        <line x1="430" y1="420" x2="408" y2="322"/>
        <!-- 上管 -->
        <line x1="408" y1="322" x2="560" y2="316"/>
        <!-- 下管 -->
        <line x1="430" y1="420" x2="560" y2="316"/>
        <!-- 前叉到前轮 -->
        <line x1="560" y1="316" x2="620" y2="420"/>
        <!-- 头管延长 -->
        <line x1="560" y1="316" x2="548" y2="288"/>
      </g>

      <!-- 车座 -->
      <path d="M378,318 q30,-12 60,0 q-28,10 -60,0 Z" fill="#5b3a29"/>
      <line x1="408" y1="322" x2="400" y2="316" stroke="#666" stroke-width="6" stroke-linecap="round"/>

      <!-- 车把 -->
      <g stroke="#555" stroke-width="7" stroke-linecap="round" fill="none">
        <path d="M548,288 L560,268 q10,-14 28,-10"/>
        <line x1="588" y1="258" x2="588" y2="272"/>
      </g>
      <circle cx="588" cy="256" r="7" fill="#333"/>

      <!-- 链条 -->
      <g stroke="#3a3a3a" stroke-width="4" fill="none" stroke-dasharray="7 5">
        <path d="M300,420 L430,420"/>
      </g>
      <!-- 飞轮 -->
      <circle cx="300" cy="420" r="14" fill="none" stroke="#888" stroke-width="4"/>
      <!-- 牙盘 + 曲柄 + 踏板（整体旋转） -->
      <g transform="translate(430,420)">
        <circle r="20" fill="none" stroke="#aaa" stroke-width="5"/>
        <g class="crank-spin">
          <circle r="8" fill="#666"/>
          <!-- 左曲柄 -->
          <line x1="0" y1="0" x2="-38" y2="14" stroke="#888" stroke-width="7" stroke-linecap="round"/>
          <!-- 右曲柄 -->
          <line x1="0" y1="0" x2="38" y2="-14" stroke="#888" stroke-width="7" stroke-linecap="round"/>
          <!-- 踏板（保持水平：反向旋转抵消） -->
          <g transform="translate(-38,14)">
            <g class="pedal-anti" style="transform-box:fill-box; transform-origin:center;">
              <rect x="-16" y="-4" width="32" height="9" rx="4" fill="#222"/>
            </g>
          </g>
          <g transform="translate(38,-14)">
            <g class="pedal-anti" style="transform-box:fill-box; transform-origin:center;">
              <rect x="-16" y="-4" width="32" height="9" rx="4" fill="#222"/>
            </g>
          </g>
        </g>
      </g>
    </g>

    <!-- ========== 鹈鹕 ========== -->
    <g class="pelican-bob">
      <!-- 尾羽 -->
      <g class="tail">
        <path d="M352,300 q-58,4 -78,-24 q34,6 48,-6 q-26,-6 -38,-26 q30,10 46,6 q-14,-12 -18,-28 q22,14 42,18 Z" fill="#e9e2d0"/>
        <path d="M352,300 q-50,2 -66,-22 q28,4 42,-4 q-20,-8 -30,-24 q24,10 40,10 Z" fill="#d8cfb8"/>
      </g>

      <!-- 身体 -->
      <path d="M370,290 q-24,-52 28,-74 q40,-16 88,4 q34,14 34,44 q0,34 -46,44 q-56,10 -104,-18 Z"
            fill="#fdfaf1" stroke="#d8cfb8" stroke-width="3"/>

      <!-- 远侧腿（右腿，在身体后面、牙盘后面蹬踏） -->
      <g class="thigh-r" opacity="0.9">
        <path d="M470,332 q30,40 8,74 l-14,0 q14,-36 -8,-66 Z" fill="#e8a33d"/>
        <!-- 小腿连接到右踏板区域 -->
        <path d="M464,400 q26,8 34,14" stroke="#e8a33d" stroke-width="10" fill="none" stroke-linecap="round"/>
        <path d="M492,412 q16,-2 22,8 l-26,4 Z" fill="#d98b25"/>
      </g>

      <!-- 翅膀（搭在车把上） -->
      <g class="wing">
        <path d="M470,282 q70,-10 116,6 q6,10 -6,16 q-60,14 -114,-2 q-10,-12 4,-20 Z"
              fill="#f2ecdd" stroke="#cfc5aa" stroke-width="3"/>
        <path d="M486,292 q56,-6 96,6 M482,300 q52,2 92,10" stroke="#d8cfb8" stroke-width="2.5" fill="none"/>
        <!-- 翅尖搭到车把 -->
        <path d="M580,296 q14,-16 10,-34 q8,20 2,38 Z" fill="#e9e2d0"/>
      </g>

      <!-- 脖子 -->
      <path d="M470,236 q-4,-64 22,-88 q20,-18 40,-2 q-24,24 -26,60 q-2,26 4,36 Z"
            fill="#fdfaf1" stroke="#d8cfb8" stroke-width="3"/>

      <!-- 头 -->
      <circle cx="512" cy="150" r="34" fill="#fdfaf1" stroke="#d8cfb8" stroke-width="3"/>
      <!-- 头顶小羽 -->
      <path d="M498,120 q14,-16 32,-8 q-10,2 -14,10 Z" fill="#f2ecdd"/>

      <!-- 眼睛 -->
      <circle cx="524" cy="142" r="7.5" fill="#2b2b2b"/>
      <circle cx="527" cy="139" r="2.6" fill="#fff"/>

      <!-- 大嘴上喙 -->
      <path d="M540,142 q74,-8 128,10 q6,6 -2,10 q-64,-8 -122,2 q-10,-10 -4,-22 Z"
            fill="#f5b93c" stroke="#d99a26" stroke-width="2.5"/>
      <!-- 喉囊（下喙） -->
      <g class="pouch">
        <path d="M542,158 q40,10 88,6 q-16,34 -52,32 q-30,-2 -38,-24 q-2,-10 2,-14 Z"
              fill="#f7cf6d" stroke="#d99a26" stroke-width="2.5"/>
      </g>
      <!-- 嘴角装饰小绒毛 -->
      <path d="M540,150 q-8,4 -12,10 M544,156 q-8,6 -10,12" stroke="#d8cfb8" stroke-width="2" fill="none"/>

      <!-- 近侧腿（左腿，在牙盘前方蹬踏） -->
      <g class="thigh-l">
        <path d="M452,330 q34,36 16,72 l-15,2 q12,-38 -12,-66 Z" fill="#f0b04a"/>
        <!-- 小腿 -->
        <path d="M456,398 q-34,4 -44,16 l14,10 q22,-10 40,-8 Z" fill="#f0b04a"/>
        <!-- 脚蹼踩踏板 -->
        <path d="M406,418 q-22,0 -30,10 q24,6 44,4 q10,-2 8,-8 q-4,-6 -22,-6 Z" fill="#d98b25"/>
      </g>
    </g>
  </g>

  <!-- 速度线（表现骑行风感） -->
  <g stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.7">
    <line x1="80" y1="300" x2="130" y2="300" class="road-dash" style="animation-duration:0.4s"/>
    <line x1="60" y1="345" x2="100" y2="345" class="road-dash" style="animation-duration:0.55s"/>
    <line x1="120" y1="260" x2="155" y2="260" class="road-dash" style="animation-duration:0.5s"/>
  </g>
</svg>

<p style="color:#5a7a86; margin-top:10px; font-size:14px;">纯 SVG + CSS 动画 · 车轮转动 / 双腿蹬踏 / 翅膀搭把 / 喉囊微晃 / 云朵与草地飞驰</p>

</body>
</html>
